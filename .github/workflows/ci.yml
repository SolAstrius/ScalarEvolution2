name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NEO_VERSION: "21.1.209"
  # Our fork's staging is LekKit/RVVM#staging + the pluggable HDA backend
  # and JNI ring API the mod's audio pipeline depends on. Flip the
  # `repository:` back to LekKit/RVVM below once those changes merge
  # upstream; this env var stays 'staging' either way.
  RVVM_REF: "staging"

jobs:
  # ---------------------------------------------------------------------
  # Build librvvm with JNI bindings for every target platform. The build
  # job below downloads these artifacts and places them under
  # src/main/resources/natives/<classifier>/ before running Gradle.
  # ---------------------------------------------------------------------
  natives-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pufit/RVVM
          ref: ${{ env.RVVM_REF }}
          path: RVVM
      - name: Build librvvm.so (linux-x86_64)
        run: cd RVVM && make lib USE_JNI=1
      - uses: actions/upload-artifact@v4
        with:
          name: librvvm-linux-x86_64
          path: RVVM/release.linux.x86_64/librvvm.so

  natives-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pufit/RVVM
          ref: ${{ env.RVVM_REF }}
          path: RVVM
      - name: Build librvvm.dylib (macos-aarch64)
        run: cd RVVM && make lib USE_JNI=1
      - uses: actions/upload-artifact@v4
        with:
          name: librvvm-macos-aarch64
          path: RVVM/release.darwin.arm64/librvvm.dylib

  natives-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pufit/RVVM
          ref: ${{ env.RVVM_REF }}
          path: RVVM
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make
      - name: Build librvvm.dll (windows-x86_64)
        shell: msys2 {0}
        run: |
          cd RVVM
          make lib USE_JNI=1
          ls -la release.windows.x86_64/
          # RVVM's Makefile emits librvvm.dll (MinGW convention) but the JVM's
          # System.mapLibraryName("rvvm") on Windows returns rvvm.dll (no lib
          # prefix). Rename so NativeLoader finds the bundled native at runtime.
          cp release.windows.x86_64/librvvm.dll release.windows.x86_64/rvvm.dll
      - uses: actions/upload-artifact@v4
        with:
          name: librvvm-windows-x86_64
          path: RVVM/release.windows.x86_64/rvvm.dll

  # ---------------------------------------------------------------------
  # Build libscev_h264 (JNI wrapper + statically-linked OpenH264 from
  # the vendored vendor/openh264/ tree) for every target platform. Same
  # artifact-upload-then-download pattern as the RVVM natives above.
  #
  # Toolchain: `zig cc` / `zig c++`. Zig bundles clang + lld + libc
  # headers; the bundled libc++ means the resulting .so has no runtime
  # libstdc++ dependency. Each platform runner grabs zig via
  # mlugg/setup-zig and invokes our native/openh264-jni/Makefile.
  # ---------------------------------------------------------------------
  natives-h264-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build libscev_h264.so (linux-x86_64)
        run: |
          make -C native/openh264-jni -j$(nproc) \
            JAVA_HOME="$JAVA_HOME" \
            OPENH264_SRC="$GITHUB_WORKSPACE/vendor/openh264" \
            OUTPUT="$GITHUB_WORKSPACE/libscev_h264.so"
      - uses: actions/upload-artifact@v4
        with:
          name: libscev_h264-linux-x86_64
          path: libscev_h264.so

  natives-h264-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build libscev_h264.dylib (macos-aarch64)
        run: |
          make -C native/openh264-jni -j$(sysctl -n hw.ncpu) \
            JAVA_HOME="$JAVA_HOME" \
            OPENH264_SRC="$GITHUB_WORKSPACE/vendor/openh264" \
            OUTPUT="$GITHUB_WORKSPACE/libscev_h264.dylib"
      - uses: actions/upload-artifact@v4
        with:
          name: libscev_h264-macos-aarch64
          path: libscev_h264.dylib

  natives-h264-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make
          # Inherit the Windows PATH so zig.exe (placed there by
          # mlugg/setup-zig via core.addPath) resolves inside the MSYS2
          # shell. Without this, the MSYS2 PATH is isolated and zig
          # vanishes from view.
          path-type: inherit
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build scev_h264.dll (windows-x86_64)
        shell: msys2 {0}
        # JAVA_HOME from GitHub env is Windows-style; convert to
        # MSYS-style so the include paths our Makefile constructs are
        # POSIX-shaped. CC/CXX use zig.exe explicitly because GNU make's
        # direct-exec fast path calls execvp without auto-appending .exe.
        run: |
          export JAVA_HOME_MSYS=$(cygpath -u "$JAVA_HOME")
          make -C native/openh264-jni -j$(nproc) \
            CC="zig.exe cc" \
            CXX="zig.exe c++" \
            JAVA_HOME="$JAVA_HOME_MSYS" \
            OPENH264_SRC="$(cygpath -u "$GITHUB_WORKSPACE")/vendor/openh264" \
            OUTPUT="$(cygpath -u "$GITHUB_WORKSPACE")/scev_h264.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: libscev_h264-windows-x86_64
          path: scev_h264.dll

  # ---------------------------------------------------------------------
  # Main build + test job.
  # ---------------------------------------------------------------------
  build:
    needs:
      - natives-linux-x64
      - natives-macos-arm64
      - natives-windows-x64
      - natives-h264-linux-x64
      - natives-h264-macos-arm64
      - natives-h264-windows-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build job re-runs buildH264Native / buildMltermNative through
      # processResources even though the artifacts are pre-downloaded —
      # Gradle has no prior state on a fresh runner. zig must be present
      # so those tasks succeed (they re-link a binary identical to the
      # downloaded artifact).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Download librvvm (linux)
        uses: actions/download-artifact@v4
        with:
          name: librvvm-linux-x86_64
          path: src/main/resources/natives/linux-x86_64
      - name: Download librvvm (macOS)
        uses: actions/download-artifact@v4
        with:
          name: librvvm-macos-aarch64
          path: src/main/resources/natives/macos-aarch64
      - name: Download librvvm (Windows)
        uses: actions/download-artifact@v4
        with:
          name: librvvm-windows-x86_64
          path: src/main/resources/natives/windows-x86_64

      - name: Download libscev_h264 (linux)
        uses: actions/download-artifact@v4
        with:
          name: libscev_h264-linux-x86_64
          path: src/main/resources/natives/linux-x86_64
      - name: Download libscev_h264 (macOS)
        uses: actions/download-artifact@v4
        with:
          name: libscev_h264-macos-aarch64
          path: src/main/resources/natives/macos-aarch64
      - name: Download libscev_h264 (Windows)
        uses: actions/download-artifact@v4
        with:
          name: libscev_h264-windows-x86_64
          path: src/main/resources/natives/windows-x86_64

      - name: List bundled natives
        run: find src/main/resources/natives -type f

      - name: Datagen
        run: ./gradlew runData --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build
        run: ./gradlew build -x test --stacktrace

      - name: GameTests
        run: ./gradlew runGameTestServer --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: build/reports/tests/runGameTestServer/
          if-no-files-found: ignore

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
