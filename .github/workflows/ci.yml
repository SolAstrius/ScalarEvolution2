name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR — a force-push or rapid
# succession of pushes shouldn't burn minutes on stale commits. Pushes to
# main keep their runs (cancel-in-progress=false there) so post-merge CI
# always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  # pufit/RVVM#staging carries the pluggable HDA backend + JNI ring API
  # the mod's audio pipeline depends on; flip back to LekKit/RVVM once
  # those merge upstream.
  RVVM_REF: "staging"

jobs:
  natives-rvvm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { triple: x86_64-linux-gnu,   os: linux,   arch: x86_64,  classifier: linux-x86_64,   reldir: release.linux.x86_64,   srcname: librvvm.so,    outname: librvvm.so    }
          - { triple: aarch64-macos-none, os: darwin,  arch: arm64,   classifier: macos-aarch64,  reldir: release.darwin.arm64,   srcname: librvvm.dylib, outname: librvvm.dylib }
          - { triple: x86_64-windows-gnu, os: windows, arch: x86_64,  classifier: windows-x86_64, reldir: release.windows.x86_64, srcname: librvvm.dll,   outname: rvvm.dll      }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pufit/RVVM
          ref: ${{ env.RVVM_REF }}
          path: RVVM
      - name: Resolve RVVM SHA
        id: rvvm-sha
        run: echo "sha=$(git -C RVVM rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Cache key includes ci.yml hash so any change to build flags / sed
      # patches invalidates. Each `staging` advance also invalidates via SHA.
      - name: Cache librvvm
        id: cache
        uses: actions/cache@v4
        with:
          path: RVVM/${{ matrix.target.reldir }}/${{ matrix.target.outname }}
          key: librvvm-${{ matrix.target.classifier }}-${{ steps.rvvm-sha.outputs.sha }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - uses: mlugg/setup-zig@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          version: 0.15.2
      - name: Build librvvm (${{ matrix.target.classifier }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd RVVM
          if [ "${{ matrix.target.os }}" = "windows" ]; then
            # zig's lld rejects two GNU-binutils-only LDFLAGS that RVVM's
            # Makefile pins behind `override LDFLAGS :=`: the `:VERSION`
            # suffix on `--subsystem,console:3.10`, and `--exclude-all-symbols`
            # entirely. Strip both — lld defaults to no auto-export anyway.
            sed -i -e 's/console:3\.10/console/' \
                   -e 's/ -Wl[^ ]*--exclude-all-symbols//' Makefile
          fi
          make lib USE_JNI=1 \
            OS=${{ matrix.target.os }} \
            ARCH=${{ matrix.target.arch }} \
            CC="zig cc -target ${{ matrix.target.triple }}" \
            CXX="zig c++ -target ${{ matrix.target.triple }}" \
            -j$(nproc)
          # System.mapLibraryName("rvvm") on Windows wants no lib prefix.
          if [ "${{ matrix.target.srcname }}" != "${{ matrix.target.outname }}" ]; then
            cp "${{ matrix.target.reldir }}/${{ matrix.target.srcname }}" \
               "${{ matrix.target.reldir }}/${{ matrix.target.outname }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: librvvm-${{ matrix.target.classifier }}
          path: RVVM/${{ matrix.target.reldir }}/${{ matrix.target.outname }}

  natives-h264:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `os` is openh264's build/platform-$(OS).mk filename — `mingw_nt`
        # has no version suffix in the openh264 tree even though `uname -s`
        # returns `mingw_nt-10.0`.
        # `jni_dir` selects between the JDK's bundled headers (linux only;
        # the Linux JDK ships no darwin/win32 jni_md.h) and our vendored
        # canonical openjdk copies under native/openh264-jni/jni_headers/.
        target:
          - { triple: x86_64-linux-gnu,   os: linux,    arch: x86_64, classifier: linux-x86_64,   jni_dir: jdk,             outname: libscev_h264.so    }
          - { triple: aarch64-macos-none, os: darwin,   arch: arm64,  classifier: macos-aarch64,  jni_dir: vendored-darwin, outname: libscev_h264.dylib }
          - { triple: x86_64-windows-gnu, os: mingw_nt, arch: x86_64, classifier: windows-x86_64, jni_dir: vendored-win32,  outname: scev_h264.dll      }
    steps:
      - uses: actions/checkout@v4
      # Cache key tracks the vendored OpenH264 tree, our JNI wrapper
      # sources/Makefile, and ci.yml (build flags). Vendor bumps and any
      # workflow change invalidate; otherwise the .so/.dylib/.dll is reused.
      - name: Cache libscev_h264
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.target.outname }}
          key: libscev_h264-${{ matrix.target.classifier }}-${{ hashFiles('vendor/openh264/**', 'native/openh264-jni/**', '.github/workflows/ci.yml') }}
      - uses: mlugg/setup-zig@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          version: 0.15.2
      - uses: actions/setup-java@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Build libscev_h264 (${{ matrix.target.classifier }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          case "${{ matrix.target.jni_dir }}" in
            jdk)              JNI_PI="$JAVA_HOME/include/linux" ;;
            vendored-darwin)  JNI_PI="$GITHUB_WORKSPACE/native/openh264-jni/jni_headers/darwin" ;;
            vendored-win32)   JNI_PI="$GITHUB_WORKSPACE/native/openh264-jni/jni_headers/win32" ;;
          esac
          # AR="zig ar" is load-bearing: GNU `ar` produces archives whose
          # member format is host-shaped, and lld-macho rejects the result
          # with "unknown cpu architecture: <bytes>" when linking a cross
          # target. zig ar (= llvm-ar) round-trips Mach-O / COFF cleanly.
          make -C native/openh264-jni -j$(nproc) \
            CC="zig cc -target ${{ matrix.target.triple }}" \
            CXX="zig c++ -target ${{ matrix.target.triple }}" \
            AR="zig ar" \
            JNI_PLATFORM_INCLUDE="$JNI_PI" \
            JAVA_HOME="$JAVA_HOME" \
            OPENH264_SRC="$GITHUB_WORKSPACE/vendor/openh264" \
            OUTPUT="$GITHUB_WORKSPACE/${{ matrix.target.outname }}" \
            OS=${{ matrix.target.os }} \
            ARCH=${{ matrix.target.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: libscev_h264-${{ matrix.target.classifier }}
          path: ${{ matrix.target.outname }}

  build:
    needs: [natives-rvvm, natives-h264]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Download librvvm (linux)
        uses: actions/download-artifact@v4
        with:
          name: librvvm-linux-x86_64
          path: src/main/resources/natives/linux-x86_64
      - name: Download librvvm (macOS)
        uses: actions/download-artifact@v4
        with:
          name: librvvm-macos-aarch64
          path: src/main/resources/natives/macos-aarch64
      - name: Download librvvm (Windows)
        uses: actions/download-artifact@v4
        with:
          name: librvvm-windows-x86_64
          path: src/main/resources/natives/windows-x86_64
      - name: Download libscev_h264 (linux)
        uses: actions/download-artifact@v4
        with:
          name: libscev_h264-linux-x86_64
          path: src/main/resources/natives/linux-x86_64
      - name: Download libscev_h264 (macOS)
        uses: actions/download-artifact@v4
        with:
          name: libscev_h264-macos-aarch64
          path: src/main/resources/natives/macos-aarch64
      - name: Download libscev_h264 (Windows)
        uses: actions/download-artifact@v4
        with:
          name: libscev_h264-windows-x86_64
          path: src/main/resources/natives/windows-x86_64
      - run: find src/main/resources/natives -type f

      # `-x build*Native` skips the local-only host rebuilds — the natives
      # jobs above already produced the artifacts. Local `./gradlew build`
      # still runs them via processResources.dependsOn.
      - name: Build, test, gametests
        run: |
          ./gradlew build runGameTestServer \
            -x buildRvvmNative -x buildH264Native -x buildMltermNative \
            --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: build/reports/tests/runGameTestServer/
          if-no-files-found: ignore
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
