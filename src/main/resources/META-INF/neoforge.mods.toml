modLoader="javafml"
loaderVersion="${loader_version_range}"
license="LGPL-3.0-or-later"
issueTrackerURL="https://github.com/LekKit/ScalarEvolution/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="icon.png"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Jade (Snownee) — optional HUD tooltip integration. Compat classes under
# lekkit.scev.compat.jade are only loaded when Jade scans the @WailaPlugin
# annotation, so the mod's absence is safe at runtime.
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15,)"
    ordering="NONE"
    side="CLIENT"

# Mixin config: creative tab section-banner injections live here.
# Client-side only — banners are pure UI decoration and the server never
# builds the creative-tab item list.
[[mixins]]
config="scev.mixins.json"
