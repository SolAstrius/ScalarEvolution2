modLoader="javafml"
loaderVersion="${loader_version_range}"
license="LGPL-3.0-or-later"
issueTrackerURL="https://github.com/SolAstrius/ScalarEvolution2/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="icon.png"
# Runtime-extends HumanoidModel.ArmPose with SCEV_HANDHELD (third-person
# raised-both-hands pose for handheld computer items). See
# lekkit.scev.client.render.HandheldArmPose.
enumExtensions="META-INF/enum_extensions.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Jade (Snownee) — optional HUD tooltip integration. Compat classes under
# lekkit.scev.compat.jade are only loaded when Jade scans the @WailaPlugin
# annotation, so the mod's absence is safe at runtime.
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15,)"
    ordering="NONE"
    side="CLIENT"

# CC: Tweaked — optional CC peripheral integration. ScevCCBootstrap
# checks ModList before touching any CC classes, so absence is safe.
# AFTER ordering so CC's PeripheralCapability is registered before our
# RegisterCapabilitiesEvent listener runs.
[[dependencies.${mod_id}]]
    modId="computercraft"
    type="optional"
    versionRange="[1.113,)"
    ordering="AFTER"
    side="BOTH"

# Create: Power Grid — optional integration target (electricity sim atop
# Create). Hard-deps Create + Architectury when present; our compat
# classes are ModList-gated so absence is safe.
[[dependencies.${mod_id}]]
    modId="powergrid"
    type="optional"
    versionRange="[0.5,)"
    ordering="AFTER"
    side="BOTH"

# Create — optional cross-mod integration target (lekkit.scev.compat.create.*,
# when populated). Soft-dep: compat classes guard with ModList checks so
# Create's absence is safe. Version range floor is the 6.0.x line that
# matches our 1.21.1 / NeoForge 21.1.x baseline.
[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0,)"
    ordering="AFTER"
    side="BOTH"

# Mixin config: creative tab section-banner injections live here.
# Client-side only — banners are pure UI decoration and the server never
# builds the creative-tab item list.
[[mixins]]
config="scev.mixins.json"
